# DigitalOcean App Platform spec. Deploy with:
#   doctl apps create --spec app.yaml
# or connect the repo through the DO dashboard and it'll detect this file.
#
# Update `github.repo` (and branch, if not main) to your fork before deploying.
name: summer-wrapped
region: nyc
services:
  - name: web
    github:
      repo: leon44/climate-wrapped
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: pip install -r requirements.txt
    run_command: gunicorn run:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    environment_slug: python
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    envs:
      - key: GATE_REPORTING_LAG_DAYS
        value: "5"
      # TESTING ONLY: pins the wrapped gate to summer 2025 so we can preview
      # the feature before summer 2026 finishes. Remove this env var (or set
      # it to a real date/blank) before sharing publicly, so the gate falls
      # back to the real current year -- see FAKE_TODAY in app/config.py.
      - key: FAKE_TODAY
        value: "2025-09-15"
    routes:
      - path: /
